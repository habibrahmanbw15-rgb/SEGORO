<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Ikan Bakar Segoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/global.css">
</head>
<body>

  <!-- ═══ NAV OVERLAY & DRAWER ═══ -->
  <div id="nav-overlay" aria-hidden="true"></div>
  <nav id="nav-drawer" aria-label="Navigasi utama">
    <div class="nav-drawer-header">
      <img src="assets/logosegro.png" alt="Segoro Banyuwangi" class="nav-drawer-logo">
      <button id="nav-close" class="nav-drawer-close" aria-label="Tutup menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="nav-drawer-links">
      <a href="index.html" data-nav-link aria-label="Beranda">
        <i class="fa-solid fa-house"></i> Beranda
      </a>
      <a href="favorit.html" data-nav-link aria-label="Menu">
        <i class="fa-solid fa-utensils"></i> Menu
      </a>
      <a href="reservation.html" data-nav-link aria-label="Reservasi">
        <i class="fa-solid fa-calendar-days"></i> Reservasi
      </a>
      <a href="gallery.html" data-nav-link aria-label="Gallery">
        <i class="fa-solid fa-images"></i> Gallery
      </a>
      <a href="location.html" data-nav-link aria-label="Lokasi">
        <i class="fa-solid fa-map-pin"></i> Lokasi
      </a>
    </div>
    <a href="cart.html" class="nav-drawer-cart" aria-label="Keranjang">
      <i class="fa-solid fa-cart-shopping"></i>
      Keranjang
      <span class="cart-badge" style="display:none;">0</span>
    </a>
  </nav>

  <!-- ═══ DESKTOP HEADER ═══ -->
  <header class="desktop-header" style="display:none;">
    <div class="desktop-header-inner">
      <div class="desktop-logo">
        <a href="index.html"><img src="assets/logosegro.png" alt="Segoro Banyuwangi"></a>
      </div>
      <nav class="desktop-nav" aria-label="Navigasi desktop">
        <a href="index.html" data-nav-link>Beranda</a>
        <a href="favorit.html" data-nav-link>Menu</a>
        <a href="reservation.html" data-nav-link>Reservasi</a>
        <a href="gallery.html" data-nav-link>Gallery</a>
        <a href="location.html" data-nav-link>Lokasi</a>
      </nav>
      <div class="desktop-nav-actions">
        <a href="cart.html" class="desktop-cart-btn cart-badge-wrapper" aria-label="Keranjang">
          <i class="fa-solid fa-cart-shopping"></i>
          Keranjang
          <span class="cart-badge" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ═══ MOBILE HEADER ═══ -->
  <header class="site-header">
    <a href="index.html" class="site-header-back" aria-label="Kembali">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <a href="index.html" class="site-header-logo" aria-label="Beranda">
      <img src="assets/logosegro.png" alt="Segoro Banyuwangi">
    </a>
    <div class="site-header-right">
      <a href="cart.html" class="header-cart-btn cart-badge-wrapper" aria-label="Keranjang">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" style="display:none;">0</span>
      </a>
      <button class="hamburger-btn" aria-label="Buka menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="menu-page">

    <!-- ═══ TITLE ═══ -->
    <section class="menu-title">
      <h1>MENU KAMI</h1>
      <p>Aneka pilihan menu lezat untuk kamu nikmati</p>
    </section>

    <!-- ═══ SEARCH ═══ -->
    <div class="search-box">
      <input
        type="search"
        id="menu-search"
        placeholder="Cari menu... (ikan, ayam, juice...)"
        aria-label="Cari menu"
        autocomplete="off"
      >
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    </div>

    <!-- ═══ CATEGORY FILTER ═══ -->
    <div class="category-filter" role="group" aria-label="Filter kategori">
      <button class="category active" aria-pressed="true">Favorit</button>
      <button class="category" aria-pressed="false">Ikan Bakar</button>
      <button class="category" aria-pressed="false">Seafood</button>
      <button class="category" aria-pressed="false">Goreng / Bakar</button>
      <button class="category" aria-pressed="false">Sayuran</button>
      <button class="category" aria-pressed="false">Minuman</button>
      <button class="category" aria-pressed="false">Tea</button>
      <button class="category" aria-pressed="false">Dingin</button>
      <button class="category" aria-pressed="false">Milk Shake</button>
      <button class="category" aria-pressed="false">Juice</button>
      <button class="category" aria-pressed="false">Squash</button>
      <button class="category" aria-pressed="false">Paket</button>
    </div>

    <!-- ═══ MENU SECTIONS (JS-rendered) ═══ -->
    <div id="menu-sections"></div>

  </main>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
