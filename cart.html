<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang — Segoro Banyuwangi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/global.css">
</head>
<body>

  <!-- ═══ NAV OVERLAY & DRAWER ═══ -->
  <div id="nav-overlay" aria-hidden="true"></div>
  <nav id="nav-drawer" aria-label="Navigasi utama">
    <div class="nav-drawer-header">
      <img src="assets/logosegro.png" alt="Segoro Banyuwangi" class="nav-drawer-logo">
      <button id="nav-close" class="nav-drawer-close" aria-label="Tutup menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="nav-drawer-links">
      <a href="index.html" data-nav-link><i class="fa-solid fa-house"></i> Beranda</a>
      <a href="favorit.html" data-nav-link><i class="fa-solid fa-utensils"></i> Menu</a>
      <a href="reservation.html" data-nav-link><i class="fa-solid fa-calendar-days"></i> Reservasi</a>
      <a href="gallery.html" data-nav-link><i class="fa-solid fa-images"></i> Gallery</a>
      <a href="location.html" data-nav-link><i class="fa-solid fa-map-pin"></i> Lokasi</a>
    </div>
    <a href="cart.html" class="nav-drawer-cart" aria-label="Keranjang">
      <i class="fa-solid fa-cart-shopping"></i> Keranjang
      <span class="cart-badge" style="display:none;">0</span>
    </a>
  </nav>

  <!-- ═══ DESKTOP HEADER ═══ -->
  <header class="desktop-header" style="display:none;">
    <div class="desktop-header-inner">
      <div class="desktop-logo">
        <a href="index.html"><img src="assets/logosegro.png" alt="Segoro Banyuwangi"></a>
      </div>
      <nav class="desktop-nav" aria-label="Navigasi desktop">
        <a href="index.html" data-nav-link>Beranda</a>
        <a href="favorit.html" data-nav-link>Menu</a>
        <a href="reservation.html" data-nav-link>Reservasi</a>
        <a href="gallery.html" data-nav-link>Gallery</a>
        <a href="location.html" data-nav-link>Lokasi</a>
      </nav>
      <div class="desktop-nav-actions">
        <a href="cart.html" class="desktop-cart-btn cart-badge-wrapper" aria-label="Keranjang">
          <i class="fa-solid fa-cart-shopping"></i> Keranjang
          <span class="cart-badge" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ═══ MOBILE HEADER ═══ -->
  <header class="site-header">
    <a href="favorit.html" class="site-header-back" aria-label="Kembali ke menu">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <span style="font-size:14px;font-weight:600;">Keranjang</span>
    <div class="site-header-right">
      <button class="hamburger-btn" aria-label="Buka menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="page-wrapper">

    <!-- Desktop two-column cart layout -->
    <div class="cart-layout" style="padding:18px 18px 0;">

      <!-- ═══ CART ITEMS ═══ -->
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h2 style="font-size:15px;font-weight:700;">Pesanan Saya</h2>
          <button id="clear-cart-btn" style="background:none;border:none;color:#ff5b5b;font-size:11px;cursor:pointer;font-family:inherit;padding:4px 8px;">
            <i class="fa-solid fa-trash" style="margin-right:4px;"></i>Hapus Semua
          </button>
        </div>

        <div id="cart-list"></div>

        <!-- Empty state -->
        <div id="cart-empty" class="empty-state" style="display:none;">
          <i class="fa-solid fa-cart-shopping"></i>
          <h3>Keranjang masih kosong</h3>
          <p>Yuk, tambahkan menu favoritmu!</p>
          <a href="favorit.html" style="
            margin-top:16px;display:inline-flex;align-items:center;gap:8px;
            padding:12px 20px;border-radius:12px;
            background:#ffd900;color:#071018;font-weight:700;font-size:12px;
            text-decoration:none;
          ">
            <i class="fa-solid fa-utensils"></i> Lihat Menu
          </a>
        </div>
      </div>

      <!-- ═══ ORDER SUMMARY ═══ -->
      <div id="cart-summary" style="display:none;">
        <div class="order-summary-box">
          <h3 style="font-size:13px;margin-bottom:14px;font-weight:700;">Ringkasan Pesanan</h3>
          <div class="order-summary-row">
            <span>Subtotal</span>
            <span id="cart-total">Rp 0</span>
          </div>
          <div class="order-summary-row">
            <span>Biaya Layanan</span>
            <span>Gratis</span>
          </div>
          <div class="order-summary-row">
            <span><strong>Total</strong></span>
            <span><strong id="cart-grand-total">Rp 0</strong></span>
          </div>
        </div>

        <!-- CTA Buttons -->
        <a href="checkout.html" style="
          display:flex;align-items:center;justify-content:center;gap:10px;
          width:100%;padding:14px;border-radius:12px;margin-bottom:10px;
          background:#ffd900;color:#071018;font-weight:700;font-size:13px;
          text-decoration:none;transition:0.2s;
        ">
          <i class="fa-solid fa-lock"></i> Checkout di Website
        </a>

        <button id="cart-wa-btn" class="btn-whatsapp" aria-label="Pesan via WhatsApp">
          <i class="fa-brands fa-whatsapp"></i> Pesan Semua via WhatsApp
        </button>

        <a href="favorit.html" style="
          display:flex;align-items:center;justify-content:center;
          width:100%;margin-top:10px;padding:11px;
          border-radius:12px;border:1px solid #29404e;
          background:transparent;color:#c5d0d6;font-size:12px;
          text-decoration:none;
        ">
          <i class="fa-solid fa-plus" style="margin-right:8px;"></i> Tambah Menu Lagi
        </a>
      </div>

    </div><!-- /.cart-layout -->

  </main>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderCartPage();

      // Sync grand total
      const grandTotalEl = document.getElementById("cart-grand-total");
      const syncTotal = () => {
        if (grandTotalEl) grandTotalEl.textContent = formatPrice(getCartTotal());
      };
      syncTotal();
      new MutationObserver(syncTotal).observe(
        document.getElementById("cart-list"),
        { childList: true, subtree: true }
      );

      // Clear all
      document.getElementById("clear-cart-btn").addEventListener("click", () => {
        if (!getCart().length) return;
        if (confirm("Hapus semua item dari keranjang?")) {
          clearCart();
          renderCartPage();
          showToast("Keranjang dikosongkan", "error");
        }
      });

      // WhatsApp — kirim SEMUA item dari cart
      document.getElementById("cart-wa-btn").addEventListener("click", () => {
        const cart = getCart();
        if (!cart.length) {
          showToast("Keranjang kosong", "error");
          return;
        }
        openWhatsAppOrder(cart);
      });
    });
  </script>
</body>
</html>
